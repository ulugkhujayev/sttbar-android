name: STTbar checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Test and build
        run: ./gradlew :app:testPlayDebugUnitTest :domain:test :app:assemblePlayDebug :app:assembleBaseDebug --no-daemon
