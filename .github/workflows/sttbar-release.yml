name: STTbar APK release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Load current release verifier
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:scripts/verify-sttbar-apk.sh > "$RUNNER_TEMP/verify-sttbar-apk.sh"
          chmod +x "$RUNNER_TEMP/verify-sttbar-apk.sh"
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Check tag and signing secrets
        env:
          STTBAR_KEYSTORE_B64: ${{ secrets.STTBAR_KEYSTORE_B64 }}
          STTBAR_STORE_PASSWORD: ${{ secrets.STTBAR_STORE_PASSWORD }}
          STTBAR_KEY_ALIAS: ${{ secrets.STTBAR_KEY_ALIAS }}
          STTBAR_KEY_PASSWORD: ${{ secrets.STTBAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*const val versionName = "\([^"]*\)".*/\1/p' buildSrc/src/main/kotlin/com/example/util/simpletimetracker/Base.kt | head -1)
          test "$RELEASE_TAG" = "v${version}"
          for name in STTBAR_KEYSTORE_B64 STTBAR_STORE_PASSWORD STTBAR_KEY_ALIAS STTBAR_KEY_PASSWORD; do
            test -n "${!name}"
          done
          printf '%s' "$STTBAR_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/sttbar.keystore"
          chmod 600 "$RUNNER_TEMP/sttbar.keystore"
      - name: Check published APK on the runner
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download "$RELEASE_TAG" --pattern sttbar-android.apk --dir "$RUNNER_TEMP/previous"
          tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools_dir/apksigner" verify --print-certs "$RUNNER_TEMP/previous/sttbar-android.apk" 2>/dev/null | grep 'certificate SHA-256'
          "$RUNNER_TEMP/verify-sttbar-apk.sh" "$RUNNER_TEMP/previous/sttbar-android.apk" "${RELEASE_TAG#v}"
      - name: Test and build signed APK
        env:
          STTBAR_KEYSTORE_PATH: ${{ runner.temp }}/sttbar.keystore
          STTBAR_STORE_PASSWORD: ${{ secrets.STTBAR_STORE_PASSWORD }}
          STTBAR_KEY_ALIAS: ${{ secrets.STTBAR_KEY_ALIAS }}
          STTBAR_KEY_PASSWORD: ${{ secrets.STTBAR_KEY_PASSWORD }}
        run: ./gradlew :app:testPlayDebugUnitTest :domain:test :app:assemblePlaySttbar --no-daemon
      - name: Report signing certificates
        env:
          STTBAR_STORE_PASSWORD: ${{ secrets.STTBAR_STORE_PASSWORD }}
          STTBAR_KEY_ALIAS: ${{ secrets.STTBAR_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$RUNNER_TEMP/sttbar.keystore" -storepass "$STTBAR_STORE_PASSWORD" -alias "$STTBAR_KEY_ALIAS" | grep 'SHA256:'
          tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools_dir/apksigner" verify --print-certs app/build/outputs/apk/play/sttbar/app-play-sttbar.apk 2>/dev/null | grep 'certificate SHA-256 digest'
      - name: Verify and stage APK
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          apk=app/build/outputs/apk/play/sttbar/app-play-sttbar.apk
          "$RUNNER_TEMP/verify-sttbar-apk.sh" "$apk" "$version"
          mkdir -p dist
          cp "$apk" dist/sttbar-android.apk
          (cd dist && sha256sum sttbar-android.apk > sttbar-android.apk.sha256)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/sttbar-android.apk dist/sttbar-android.apk.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" dist/sttbar-android.apk dist/sttbar-android.apk.sha256 \
              --title "STTbar Android $RELEASE_TAG" \
              --notes "Signed APK for the STTbar phone companion. Install over the previous STTbar debug package."
          fi
