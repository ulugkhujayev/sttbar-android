name: STTbar APK release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Check tag and signing secrets
        env:
          STTBAR_KEYSTORE_B64: ${{ secrets.STTBAR_KEYSTORE_B64 }}
          STTBAR_STORE_PASSWORD: ${{ secrets.STTBAR_STORE_PASSWORD }}
          STTBAR_KEY_ALIAS: ${{ secrets.STTBAR_KEY_ALIAS }}
          STTBAR_KEY_PASSWORD: ${{ secrets.STTBAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*const val versionName = "\([^"]*\)".*/\1/p' buildSrc/src/main/kotlin/com/example/util/simpletimetracker/Base.kt | head -1)
          test "${GITHUB_REF_NAME}" = "v${version}"
          for name in STTBAR_KEYSTORE_B64 STTBAR_STORE_PASSWORD STTBAR_KEY_ALIAS STTBAR_KEY_PASSWORD; do
            test -n "${!name}"
          done
          printf '%s' "$STTBAR_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/sttbar.keystore"
          chmod 600 "$RUNNER_TEMP/sttbar.keystore"
      - name: Test and build signed APK
        env:
          STTBAR_KEYSTORE_PATH: ${{ runner.temp }}/sttbar.keystore
          STTBAR_STORE_PASSWORD: ${{ secrets.STTBAR_STORE_PASSWORD }}
          STTBAR_KEY_ALIAS: ${{ secrets.STTBAR_KEY_ALIAS }}
          STTBAR_KEY_PASSWORD: ${{ secrets.STTBAR_KEY_PASSWORD }}
        run: ./gradlew :app:testPlayDebugUnitTest :domain:test :app:assemblePlaySttbar --no-daemon
      - name: Verify and stage APK
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          apk=app/build/outputs/apk/play/sttbar/app-play-sttbar.apk
          scripts/verify-sttbar-apk.sh "$apk" "$version"
          mkdir -p dist
          cp "$apk" dist/sttbar-android.apk
          (cd dist && sha256sum sttbar-android.apk > sttbar-android.apk.sha256)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/sttbar-android.apk dist/sttbar-android.apk.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/sttbar-android.apk dist/sttbar-android.apk.sha256 \
              --title "STTbar Android $GITHUB_REF_NAME" \
              --notes "Signed APK for the STTbar phone companion. Install over the previous STTbar debug package."
          fi
